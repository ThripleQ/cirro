name: build

on:
  push:
    branches: [main, beta]
  pull_request:
  # 手动触发：Actions 页 → build → Run workflow。改了不推代码也能重出包。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        # 别用 android-actions/setup-android：它在新版 ubuntu runner 上第 4 步就挂
        # （仓库 147 号运行实测，19 秒失败，后面全 skipped）。runner 镜像自带
        # Android SDK 和 cmdline-tools，直接用它自带的 sdkmanager 装缺的组件。
        #   platforms;android-37 / build-tools  ← 与 libs.versions.toml 的
        #     compileSdk 对齐；装不上也别炸，AGP 联网时自己会补。
        #   ndk;27.2.12479018 / cmake;3.22.1   ← 必须与 app/build.gradle.kts 的
        #     ndkVersion / externalNativeBuild.version 逐字一致，否则 CMake 那步会
        #     卡在下载上直到 job 超时。这两个装不上就真跑不了，不吞错误。
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then echo "::error::sdkmanager not found"; exit 1; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$SM"
          # 接受 license：写哈希文件 + yes 双保险，任一生效即可
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-37" || echo "::warning::platforms;android-37 未装上，交给 AGP"
          "$SM" --install "build-tools;37.0.0" || echo "::warning::build-tools;37.0.0 未装上，交给 AGP"
          "$SM" --install "ndk;27.2.12479018" "cmake;3.22.1"
          "$SM" --list_installed | grep -E "ndk|cmake|platforms|build-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        # **在出包之前**跑：这些接口没有公开文档，键名是探针实测猜出来的，壳子随时会变，
        # 而漏读一个字段不会崩、只会变成「封面全灰 / 徽标不画」这类静默错误 —— 单测是
        # 唯一的护栏。纯 JVM，不需要模拟器，几十秒；挂了就不必再花几分钟打两个包。
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload unit test report
        # always()：测试红的时候也要能下载报告看是哪条断言挂了。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build APKs
        # debug 包留着排障（日志全开、LeakCanary 在线）；日常装的是 release ——
        # debug 版 Compose 没优化、R8 没跑，滚动和转场明显更卡。
        # release 会走 R8 + 资源压缩，且 native 要编三个 ABI，比 debug 慢不少。
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nume-debug
          # 用 glob 而不是写死文件名：AGP 改输出目录名时不至于让这一步变红
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nume-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error