# Cirro version catalog. Curated to what the app actually needs.
# AGP/Kotlin/Compose versions match the current android compose-samples set
# (verified-buildable combination with AGP 9 built-in Kotlin).
[versions]
agp = "9.3.1"
kotlin = "2.4.10"
compileSdk = "37"
targetSdk = "37"
minSdk = "26"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
media3 = "1.11.0"
coroutines = "1.11.0"
okhttp = "5.4.0"
coil = "2.7.0"
room = "2.8.5"
ksp = "2.3.9"
hilt = "2.59.2"
androidxHilt = "1.3.0"
serialization = "1.9.0"
composeIcons = "1.7.8"
shimmer = "1.5.0"
androidxBaselineProfile = "1.5.0"
androidxBenchmark = "1.5.0"
uiautomator = "2.4.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
leakcanary = "2.14"
androidxMetrics = "1.0.0"
androidxSplashscreen = "1.2.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "composeIcons" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "composeIcons" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
